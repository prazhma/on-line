<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оперативный календарь сервиса — ПИН-АВТО</title>
    
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="stylesheet" href="css/main.css">
</head>
<body style="padding: 10px !important;">

<div class="calendar-page-wrapper">
    
    <!-- КОМПАКТНАЯ ШАПКА -->
    <div class="card-header-flex" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <p class="cabinet-page-subtitle" style="display: none;">Полная информация по записям, постам и связанным сделкам STOCRM</p>
        <a href="index.html" class="btn-link" style="font-size: 13px; font-weight: bold; text-decoration: none; color: #1e5799;">← На главную</a>
    </div>

    <div class="calendar-container" style="padding: 12px 15px !important;">
        
        <!-- СТРОКА ФИЛЬТРОВ (Выровнена по верхнему краю) -->
        <div class="calendar-filters-row" style="display: flex; align-items: flex-start; gap: 20px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #cccccc;">
            
            <!-- Блок 1: Филиал -->
            <div style="min-width: 240px;">
                <label for="branchSelect" style="display: block; margin-bottom: 6px; font-size: 11px; color: #444;">Филиал обслуживания:</label>
                <select id="branchSelect" class="auth-input-field" style="width: 100%; height: 32px !important; padding: 2px 10px !important; font-size: 12px !important;">
                    <option value="">-- Загрузка филиалов... --</option>
                </select>
            </div>
            
            <!-- Блок 2: Автообновление + ТАЙМЕР СНИЗУ -->
            <div style="min-width: 170px;">
                <label for="refreshSelect" style="display: block; margin-bottom: 6px; font-size: 11px; color: #444;">Автообновление:</label>
                <select id="refreshSelect" style="width: 100%; height: 32px !important; padding: 2px 10px !important; font-size: 12px !important; margin-bottom: 4px;">
                    <option value="0">Выключено</option>
                    <option value="60000">Каждую 1 мин</option>
                    <option value="180000">Каждые 3 мин</option>
                    <option value="300000">Каждые 5 мин</option>
                </select>
                
                <!-- Цифровые зеленые часы без черного фона -->
                <div id="lightTimerContainer" style="display: none; text-align: center; margin-top: 6px;">
                    <span style="font-size: 10px; color: #64748b; vertical-align: middle; margin-right: 4px; text-transform: uppercase;">Обновление через:</span>
                    <span id="lightTimerDisplay" style="font-family: 'Courier New', monospace; font-size: 16px; font-weight: 900; color: #10b981; text-shadow: 0 0 2px rgba(16, 185, 129, 0.4); vertical-align: middle; letter-spacing: 1px;">00:00</span>
                </div>
            </div>

            <!-- Блок 3: Выбор дат -->
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 6px; font-size: 11px; color: #444;">Дата календаря:</label>
                <!-- Кнопки недель -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button type="button" class="week-btn" id="btnWeekPrev" onclick="switchWeekTab(-1)" style="flex: 1; height: 32px !important; padding: 0 5px !important; font-size: 12px !important;">Прошлая неделя</button>
                    <button type="button" class="week-btn active" id="btnWeekCurrent" onclick="switchWeekTab(0)" style="flex: 1; height: 32px !important; padding: 0 5px !important; font-size: 12px !important;">Эта неделя</button>
                    <button type="button" class="week-btn" id="btnWeekNext" onclick="switchWeekTab(1)" style="flex: 1; height: 32px !important; padding: 0 5px !important; font-size: 12px !important;">Следующая неделя</button>
                    <button type="button" class="week-btn" onclick="loadTimelineGrid(false)" style="height: 32px !important; padding: 0 16px !important; font-size: 12px !important; background: #e2e8f0; border-color: #cbd5e1; color: #334155;">🔄 Обновить сетку</button>
                </div>
                <!-- Сетка дней -->
                <div class="grid-v4" id="grid_v4" style="display: flex; gap: 6px; margin-bottom: 10px; margin-top: 10px"></div>
                <input type="hidden" id="dateSelect" value="">
            </div>
            
        </div>

        <div id="timelineContainer">
            <div style="text-align: center; padding: 30px; color: #666; font-size: 13px; font-weight: bold;">Выберите филиал и дату для отображения календаря</div>
        </div>

    </div>
</div>

<!-- Модальное окно -->
<div id="eventModal" class="modal-overlay" onclick="closeEventModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="card-header-flex" style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 17px;">Детали записи в календаре</h3>
            <span class="modal-close" onclick="closeEventModal()" style="font-size: 24px; line-height: 1; cursor: pointer; color: #64748b;">&times;</span>
        </div>
        
        <div id="modalLoading" style="text-align: center; padding: 30px; font-weight: bold; color: #1e5799; display: none;">
            Загрузка полной информации из STOCRM...
        </div>

        <div id="modalContent" style="display: none;"></div>
    </div>
</div>

<script src="js/calendar.js" defer></script>
</body>
</html>
